# Model registry. See idx_agent_infrastructure_diagrams_md.md section 5.
#
# Fields:
#   name           public model name shown in LibreChat
#   provider       strands model provider (anthropic, openai, ...)
#   model_id       provider-specific model id
#   key_ref        env var name holding the API key
#   context_limit  used to trim history for this model
#   supports_tools whether the model can be trusted with tool calling
#   tier           cheap | standard | strong
#   fallback       name of the registry entry to retry on provider errors

models:
  - name: idx-analyst-claude
    provider: anthropic
    # Haiku 4.5, not Sonnet — deliberately the cheapest current Claude model, since
    # the user has limited Anthropic credit and this is still being verified for
    # the first time. Swap to a Sonnet model_id once ready to spend more per call.
    model_id: claude-haiku-4-5-20251001
    key_ref: ANTHROPIC_API_KEY
    context_limit: 200000
    supports_tools: true
    tier: cheap
    fallback: idx-analyst-gpt

  - name: idx-analyst-gpt
    provider: openai
    model_id: TODO
    key_ref: OPENAI_API_KEY
    context_limit: 0
    supports_tools: true
    tier: standard
    fallback: null

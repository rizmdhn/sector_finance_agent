# Model registry. See idx_agent_infrastructure_diagrams_md.md section 5.
#
# Fields:
#   name           public model name shown in LibreChat
#   provider       strands model provider (anthropic, openai, ...)
#   model_id       provider-specific model id
#   key_ref        env var name holding the API key
#   context_limit  used to trim history for this model
#   supports_tools whether the model can be trusted with tool calling
#   tier           cheap | standard | strong — gateway/registry.py's select_for_tier
#                  uses this to resolve gateway/roles/orchestrator.py's per-role
#                  ROLE_TIERS map. A tier with no real (non-TODO) model_id below is
#                  silently skipped and every role asking for it falls back to
#                  whatever model the request itself picked — see ROLE_TIERS'
#                  docstring. `cheap`/`standard`/`strong` are all real Anthropic
#                  models as of 2026-09-24 (item 36) — whether any role actually
#                  runs on `standard`/`strong` is still a separate, deliberate
#                  choice in ROLE_TIERS (every role defaults to `cheap`).
#   fallback       name of the registry entry to retry on provider errors
#   effort         optional, anthropic only: output_config.effort ("low".."max") —
#                  thinking depth/spend WITHIN this model, distinct from tier
#                  (which model). Omit for Haiku 4.5 — it errors if this field is
#                  present at all, even unset/default.

models:
  - name: idx-analyst-claude
    provider: anthropic
    # Haiku 4.5, not Sonnet — deliberately the cheapest current Claude model, since
    # the user has limited Anthropic credit and this is still being verified for
    # the first time. Swap to a Sonnet model_id once ready to spend more per call.
    model_id: claude-haiku-4-5-20251001
    key_ref: ANTHROPIC_API_KEY
    context_limit: 200000
    supports_tools: true
    tier: cheap
    fallback: idx-analyst-gpt

  - name: idx-analyst-gpt
    provider: openai
    model_id: TODO
    key_ref: OPENAI_API_KEY
    context_limit: 0
    supports_tools: true
    tier: standard
    fallback: null
    # Still a placeholder (unrelated to the two real Anthropic tiers below) —
    # select_for_tier skips it automatically (model_id stays TODO), so it never
    # competes with idx-analyst-claude-sonnet for the "standard" tier.

  - name: idx-analyst-claude-sonnet
    provider: anthropic
    model_id: claude-sonnet-5
    key_ref: ANTHROPIC_API_KEY
    context_limit: 1000000
    supports_tools: true
    tier: standard
    fallback: idx-analyst-claude
    # No effort override — Sonnet 5's own default (equivalent to "high") applies.

  # Recommended over "Sonnet 5 at max effort" for this tier (see PROGRESS.md item
  # 36): effort only deepens thinking WITHIN a model, Opus is a genuinely more
  # capable model — closer to what "strong" / "difficult conflicts" actually
  # means per ROLE_TIERS' own comment. ~2.5x Sonnet 5's price ($5/$25 vs $2/$10
  # per 1M tokens), acceptable here since this tier is only reachable by
  # independent_risk_and_evidence_officer, which the Chief already calls
  # selectively, not on every question.
  - name: idx-analyst-claude-opus
    provider: anthropic
    model_id: claude-opus-5
    key_ref: ANTHROPIC_API_KEY
    context_limit: 1000000
    supports_tools: true
    tier: strong
    fallback: idx-analyst-claude-sonnet
    effort: max

# No chat UI is wired up yet — the agent-gateway's OpenAI-compatible API can be hit
# directly (curl, Postman, scripts/manage.py) in the meantime. Leaning towards Open
# WebUI over LibreChat (see librechat.yaml, kept around in case that changes); add its
# service here once decided.

services:
  agent-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - valkey
      - postgres

  ingest-worker:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    env_file: .env
    depends_on:
      - valkey
      - postgres

  valkey:
    image: valkey/valkey:latest
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

volumes:
  valkey_data:
  postgres_data:
